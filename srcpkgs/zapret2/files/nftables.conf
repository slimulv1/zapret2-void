#!/usr/sbin/nft -f
#
# /etc/nftables.conf — cấu hình firewall nftables cho Void Linux
#
# Tên bảng "void_filter" là BẮT BUỘC: service runit của zapret2
# (/etc/sv/zapret2/run) chờ bảng này xuất hiện rồi mới khởi động,
# nếu không có nó zapret2 sẽ treo vô hạn.
#
# File này được load bởi /etc/sv/nftables/run (lúc boot và khi
# `sv restart nftables`). Lưu ý: finish script của service này
# chạy `nft flush ruleset` — dừng service sẽ xóa SẠCH toàn bộ ruleset.

table inet void_filter {

    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback luôn cho qua
        iif lo accept

        # Traffic đã thiết lập hoặc thuộc traffic trả lời
        ct state established,related accept
        ct state invalid drop

        # ICMP: cần cho ping + thông báo lỗi (path MTU discovery).
        # Bỏ mũi tên IPv6 nếu bạn không dùng IPv6.
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH đã TẮT ngày 2026-11-17: service sshd bị gỡ khỏi runit,
        # không còn tiến trình nào lắng nghe cổng 22. Muốn bật lại SSH:
        #   ln -s /etc/sv/sshd /var/service/
        # rồi bỏ comment dòng dưới và chạy: sv restart nftables
        # tcp dport 22 ct state new limit rate 10/minute accept

        # DHCP client. NetworkManager thường dùng raw socket nên không
        # cần, nhưng giữ lại cho chắc khi dùng dhclient/sdparm.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
    }

    chain forward {
        # Máy này không làm router. Nếu bạn dùng VPN (xl2tpd/strongswan)
        # hoặc chia sẻ mạng, cần sửa lại chain này.
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
